[project]
name = "gbfs_etl"
version = "0.0.1"
authors = [{ name = "denys.vivdenko.k@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]
# Default group: real end-to-end tests against Databricks Connect.
databricks = [
    { include-group = "dev" },
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]
# `uv run --only-group local pytest` — fast local Spark, no Databricks connection.
# databricks-connect vendors its own `pyspark` and refuses local masters, so this
# group installs plain pyspark instead and must never be combined with `databricks`.
local = [
    { include-group = "dev" },
    "pyspark==3.5.0",
]

[project.scripts]
main = "gbfs_etl.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbfs_etl"]

[tool.ruff]
line-length = 120

[tool.uv]
default-groups = ["databricks"]

[tool.pytest.ini_options]
pythonpath = ["src/pipelines"]
filterwarnings = [
    # pyspark's Arrow conversion path (pyspark/sql/pandas/types.py) uses
    # distutils.version.LooseVersion internally; unrelated to project code.
    "ignore:distutils Version classes are deprecated.*:DeprecationWarning",
    # pyspark's timestamp decoding path (pyspark/sql/types.py) uses
    # datetime.utcfromtimestamp internally; unrelated to project code.
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated.*:DeprecationWarning",
]
