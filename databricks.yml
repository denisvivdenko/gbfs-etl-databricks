bundle:
  name: gbfs_etl
  uuid: 27d9cee8-725d-4bc5-92ad-40618f331c83

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-0bf2b223-5fb5.cloud.databricks.com
    variables:
      catalog: gbfs
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-0bf2b223-5fb5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/denys.vivdenko.k@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/denys.vivdenko.k@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: gbfs
      schema: prod
    permissions:
      - user_name: denys.vivdenko.k@gmail.com
        level: CAN_MANAGE
