resources:
  pipelines:
    gbfs_etl:
      name: gbfs_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: false
      root_path: "../src"
      libraries:
        - glob:
            include: ../src/gbfs_etl/pipelines/station_status/**
      environment:
        dependencies:
          - --editable ${workspace.file_path}
